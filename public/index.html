<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Part-Time Creator Academy</title>
    <link rel="stylesheet" href="/css/style.css">
    <style>
        html, body {
            height: 100%;
        }
        body {
            background: #f7f7f2;
            margin: 0;
            padding: 0;
            min-height: 100vh;
        }
        .container {
            width: 100vw;
            max-width: none;
            margin: 0;
            border-radius: 0;
            box-shadow: none;
            padding: 0;
        }
        .navbar {
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 32px 48px 32px 48px;
            box-sizing: border-box;
        }
        .logo {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .logo svg {
            height: 36px;
            width: 36px;
        }
        .logo-text {
            font-size: 1.5rem;
            font-weight: 700;
            color: #22223b;
            letter-spacing: -1px;
        }
        .nav-links {
            display: flex;
            gap: 32px;
            align-items: center;
            justify-content: center;
            flex: 1;
        }
        .nav-links a {
            color: #22223b;
            text-decoration: none;
            font-weight: 500;
            font-size: 1.08rem;
            padding: 4px 0;
        }
        .cta-nav {
            background: #ffb085;
            color: #22223b;
            border: none;
            border-radius: 24px;
            padding: 12px 28px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
            white-space: nowrap;
        }
        .cta-nav:hover {
            background: #ffa06a;
        }
        .hero {
            text-align: center;
            margin-top: 40px;
            padding: 0 48px;
        }
        .hero-title {
            font-size: 3.2rem;
            font-weight: 800;
            color: #22223b;
            line-height: 1.1;
            margin-bottom: 0.5rem;
        }
        .hero-underline {
            display: inline-block;
            border-bottom: 6px solid #bcb6ff;
            border-radius: 4px;
            padding-bottom: 0.1em;
            margin-bottom: 0.2em;
        }
        .hero-desc {
            font-size: 1.35rem;
            color: #22223b;
            margin: 1.5rem 0 2.5rem 0;
            font-weight: 400;
        }
        .cta-main {
            background: #ffb085;
            color: #22223b;
            border: none;
            border-radius: 32px;
            padding: 20px 48px;
            font-size: 1.25rem;
            font-weight: 700;
            cursor: pointer;
            transition: background 0.2s;
            box-shadow: 0 2px 8px rgba(0,0,0,0.04);
        }
        .cta-main:hover {
            background: #ffa06a;
        }
        @media (max-width: 900px) {
            .navbar, .hero {
                padding-left: 16px;
                padding-right: 16px;
            }
            .nav-links {
                gap: 18px;
            }
        }
        @media (max-width: 700px) {
            .hero-title {
                font-size: 2rem;
            }
            .navbar, .hero {
                padding-left: 4px;
                padding-right: 4px;
            }
            .navbar {
                flex-direction: column;
                gap: 16px;
            }
            .nav-links {
                gap: 12px;
                flex-wrap: wrap;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <nav class="navbar">
            <div class="logo">
                <svg viewBox="0 0 48 48" fill="none"><path d="M8 24L40 24M8 24L24 8M8 24L24 40" stroke="#6ed3f7" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/></svg>
                <span class="logo-text">Your Brand</span>
            </div>
            <div class="nav-links">
                <a href="#">My Book</a>
                <a href="#">Free Resources</a>
                <a href="#">YouTube Academy</a>
                <a href="#">LifeOS Productivity System</a>
            </div>
            <button class="cta-nav">Join 270k+ Subscribers</button>
        </nav>
        <section class="hero">
            <h1 class="hero-title">
                Join The <span class="hero-underline">Part-Time Creator</span><br>Academy
            </h1>
            <div class="hero-desc">
                Discover the proven strategies and techniques to thrive on YouTube &mdash;<br>
                without <strong>quitting your day job</strong>
            </div>
            <button class="cta-main">Enrol Now for $995</button>
        </section>
    </div>
</body>
</html>
